[project]
name = "adlift"
version = "0.1.0"
description = "Real-time causal copy testing for ad creatives, powered by TabPFN 3.5"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jinseriouspark" }]
keywords = ["tabpfn", "advertising", "causal-inference", "llm", "ad-copy"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.8",
    "pillow>=10.2",
]

[project.optional-dependencies]
# Hosted TabPFN 3.5 (recommended: text-native models live here).
client = ["tabpfn-client>=0.6.0"]
# Local open-source inference. Pulls torch, so it is deliberately separate.
local = ["tabpfn>=2.0"]
# Banner text extraction and copy-variant generation with Claude.
llm = ["anthropic>=0.40"]
# Model Context Protocol server.
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
all = [
    "tabpfn-client>=0.6.0",
    "anthropic>=0.40",
    "mcp>=1.2",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
adlift = "adlift.cli:app"
adlift-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adlift", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# typer's declarative defaults are function calls by design.
"src/adlift/cli.py" = ["B008"]
